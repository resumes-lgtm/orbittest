<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIT for Schools – Noel demo preview</title>
<style>
:root{--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--bg:#f7f8fa;--card:#fff;--acc:#1f4e79}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--acc);color:#fff;padding:14px 16px}header h1{margin:0;font-size:18px}header p{margin:2px 0 0;font-size:13px;opacity:.85}
.syn{background:#fff7e0;color:#7a5b00;font-size:12.5px;padding:8px 16px;border-bottom:1px solid #f0e2b0}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:14px;color:var(--ink)}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:14px 12px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 6px}h3{font-size:14px;margin:12px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
p{margin:6px 0}.mut{color:var(--mut);font-size:13.5px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;color:#fff}
.pill.none{background:#e5e7eb;color:#374151}
.big{font-size:30px;font-weight:700}
.bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.btn{display:block;width:100%;border:0;background:var(--acc);color:#fff;border-radius:10px;padding:13px;font-size:16px;font-weight:600;margin-top:10px}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut);margin-left:4px}
.f{border-left:4px solid #ccc;padding:2px 0 2px 10px;margin:10px 0}.f.high{border-color:#C45B56}.f.moderate{border-color:#DC9950}.f.low{border-color:#65A8AB}
pre{white-space:pre-wrap;background:#f3f4f6;border-radius:8px;padding:10px;font-size:13px;margin:6px 0}
.ws{border:1px dashed #9ca3af;border-radius:8px;padding:10px;background:#fff}
details{margin-top:6px}summary{color:var(--acc);font-size:14px}
</style></head><body>
