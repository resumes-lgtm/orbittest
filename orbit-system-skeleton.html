  const m = COST_MODEL[cat];
  const t = Math.max(0, Math.min(1, (95 - score) / (95 - 30)));
  return Math.round(m.ceiling + (m.floor - m.ceiling) * t);
}

/* Seeded generator — deterministic so the list doesn't reshuffle on re-render */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generateMockOrgs(count, seed = 42) {
  const rnd = mulberry32(seed);
  const out = [];
  for (let i = 0; i < count; i++) {

    const friction = Math.round(30 + rnd() * 60);
    const readiness = Math.round(100 - friction * 0.75 + rnd() * 12 - 6);
    const categories = CATEGORY_NAMES.map((cat) => ({
      cat, score: Math.max(15, Math.min(95, Math.round(friction + (rnd() * 30 - 15)))),
    }));
    const sorted = [...categories].sort((a, b) => a.score - b.score);
    const missions = [...new Set(sorted.slice(0, 3).map((c) => LOWEST_TO_MISSION[c.cat]))];
    out.push({
      name: `${name} ${i + 1}`, sector, lens: "Readiness → Placement Pipeline",
      friction, readiness: Math.max(10, Math.min(95, readiness)), band: bandFor(friction),
      entry: friction >= 72 ? "Full diagnostic before pilot" : "2–3 week pilot",
      categories, missions,
    });
  }
  return out;
}

/* Classification — the actual rule logic behind the definitions shown in the UI */
function classify(score, trend) {
  if (score >= 4.0 && trend >= 0) return { category: "Ready-Now", urgency: "Low" };
  if (score >= 3.5 && score < 4.0 && trend >= 0.3) return { category: "High-Potential", urgency: "Medium" };
  if (score < 2.8 || trend <= -0.4) {
    const urgency = (score < 2.5 || trend <= -0.6) ? "High" : "Medium";
    return { category: "At-Risk", urgency };
  }
  return { category: "Developing", urgency: null };
}

function generateParticipants(count, seed = 7) {
  const rnd = mulberry32(seed);
  const out = [];
  for (let i = 0; i < count; i++) {
    const first = FIRST_NAMES[Math.floor(rnd() * FIRST_NAMES.length)];
    const last = LAST_NAMES[Math.floor(rnd() * LAST_NAMES.length)];
    // Skew toward the "Developing" middle band, like a real cohort distribution
    const score = Math.round((2.0 + rnd() * 3.0) * 10) / 10;
    const trend = Math.round((rnd() * 1.8 - 0.9) * 10) / 10;
    const c = classify(score, trend);
    out.push({
      id: `gen-${i}`, name: `${first} ${last[0]}.`, cohort: COHORTS[Math.floor(rnd() * COHORTS.length)],
      score, trend, category: c.category, urgency: c.urgency,
    });
  }
  return out;
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;

}

function stageFor(readiness100) {
  if (readiness100 >= 85) return "Placement-Ready";
  if (readiness100 >= 65) return "Referral-Ready";
  if (readiness100 >= 40) return "Developing";
  return "Exploring";
}
const EMPLOYERS = ["Swisher", "JEA", "CSX", "Baptist Health"];

/* Deterministic — same participant always builds the same profile, no reshuffling on re-render */
function buildProfile(p) {
  const rnd = mulberry32(hashStr(p.id || p.name));
  const readiness100 = Math.max(8, Math.min(97, Math.round(p.score * 20 + (rnd() * 10 - 5))));
  const stage = stageFor(readiness100);
  const categories = PROFILE_CATEGORIES.map((cat) => ({
    cat, score: Math.max(20, Math.min(98, Math.round(readiness100 + (rnd() * 30 - 15)))),
  }));
  const sortedAsc = [...categories].sort((a, b) => a.score - b.score);
  const nextSteps = sortedAsc.slice(0, 3).map((c, i) => ({
    task: NEXT_STEP_MAP[c.cat],
    status: i === 0 ? "In Progress" : rnd() > 0.5 ? "Scheduled" : "Enrolled",
  }));
  const weakest = sortedAsc[0].cat, strongest = sortedAsc[sortedAsc.length - 1].cat;
  const activity = [
    { label: `Completed ${NEXT_STEP_MAP[strongest]}`, date: "May 20, 2026" },
    { label: "Attended employer hiring event", date: "May 16, 2026" },
    { label: "Reassessment completed", date: "May 15, 2026" },
    { label: `Enrolled in ${NEXT_STEP_MAP[weakest]}`, date: "May 10, 2026" },
  ];
  const hired = stage === "Placement-Ready" && rnd() > 0.4;
  const outcome = {
    interviewed: Math.floor(rnd() * 3) + (stage === "Exploring" ? 0 : 1),
    offers: hired ? 1 : stage === "Placement-Ready" ? 1 : 0,
    hired,
    startDate: hired ? "June 3, 2026" : null,
    employer: hired ? EMPLOYERS[Math.floor(rnd() * EMPLOYERS.length)] : null,
    wage: hired ? `$${(18 + rnd() * 4).toFixed(2)}/hr` : null,
  };
  return { readiness100, stage, categories, nextSteps, activity, outcome };
}

function quadrantDots(count, seed) {
  const rnd = mulberry32(seed);
  const n = Math.min(22, Math.max(8, Math.round(count / 28)));
  return Array.from({ length: n }, () => ({ x: 8 + rnd() * 84, y: 8 + rnd() * 84 }));
}

function buildCaseManagerQueue() {

  return pool

    .slice(0, 8)
    .map((p) => {
      const cat = RADAR_CATEGORY_DEFS.find((r) => r.cat === "At-Risk");
      const rule = ROOT_CAUSE_RULES[Math.abs(hashStr(p.name)) % ROOT_CAUSE_RULES.length];

function buildExecutiveActions() {
  const actions = [];
  const liftJax = CLIENT_DETAIL["LIFT JAX — Debs Store"];
  if (liftJax) {
    const worstCat = [...liftJax.readinessScores].sort((a, b) => a.score - b.score)[0];
    actions.push({
      title: `Fund a ${worstCat.cat} intervention for LIFT JAX`,
      why: `Lowest-scoring readiness category (${worstCat.score}/100) — highest cost-of-gap category, per Cost of Readiness Gaps.`,
      impact: "Highest $ leverage of any single readiness investment this period.", tag: "Cost of Gaps",
    });
    const funnel = liftJax.funnel;
    let worstDrop = { from: null, pct: 0 };
    for (let i = 1; i < funnel.length; i++) {
      const drop = 1 - funnel[i].value / funnel[i - 1].value;
      if (drop > worstDrop.pct) worstDrop = { from: funnel[i - 1].stage, to: funnel[i].stage, pct: drop };
    }
    actions.push({
      title: `Investigate the ${worstDrop.from} → ${worstDrop.to} drop-off`,
      why: `${Math.round(worstDrop.pct * 100)}% of participants are lost at this pipeline stage — the largest single drop in the funnel.`,
      impact: "Fixing this stage has more leverage than adding new intake.", tag: "Pipeline Funnel",
    });
  }
  const readyNowCount = SUCCESSION_CANDIDATES.filter((c) => c.stage === "Ready Now").length;
  if (readyNowCount > 0) {
    actions.push({
      title: `Approve ${readyNowCount} pending promotion${readyNowCount > 1 ? "s" : ""}`,
      why: `${SUCCESSION_CANDIDATES.filter((c) => c.stage === "Ready Now").map((c) => c.name).join(", ")} scored Ready Now in Succession Pipeline.`,
      impact: "Delaying a Ready Now decision risks attrition of your highest-readiness talent.", tag: "Succession Pipeline",
    });
  }
  const highFrictionLeads = SIGNALSCAN_ORGS.filter((o) => o.band === "High").length;
  actions.push({
    title: `Prioritize outreach to ${highFrictionLeads} High-friction leads`,
    why: `${highFrictionLeads} scanned orgs are in the High friction band — the strongest buying signal SignalScan produces.`,
    impact: "Highest-probability new engagements in the pipeline.", tag: "SignalScan",
  });
  return actions;
}

      <DataNote>Synthesized from Cost of Readiness Gaps, Pipeline Funnel, Succession Pipeline, and SignalScan — one ranked list instead of four dashboards to check separately.</DataNote>
    </Card>
  );
}

function ParticipantView() {
  const [selectedId, setSelectedId] = useState(WATCHLIST[0] ? "curated-0" : null);
  const pool = [...WATCHLIST.map((w, i) => ({ ...w, id: `curated-${i}` })), ...FLAGGED.slice(0, 20)];
  const p = pool.find((x) => x.id === selectedId) || pool[0];
  const prof = buildProfile(p);
  const steps = prof.nextSteps.map((s) => PARTICIPANT_FRIENDLY_COPY[s.task] || s.task);
  return (
    <Card light>
      <div style={{ marginBottom: 16 }}>
        <SectionLabel light>Choose a participant</SectionLabel>
        <select value={p.id} onChange={(e) => setSelectedId(e.target.value)} style={{
          background: L.panelAlt, border: `1px solid ${L.line}`, borderRadius: 8, padding: "8px 12px",
          color: L.text, fontFamily: "Inter", fontSize: 12.5, outline: "none",
        }}>
          {pool.map((x) => <option key={x.id} value={x.id}>{x.name}</option>)}
        </select>
      </div>
      <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 22, fontWeight: 700, color: L.text, marginBottom: 4 }}>Hi {p.name.split(" ")[0]} 👋</div>
      <div style={{ fontFamily: "Inter", fontSize: 13.5, color: L.textMute, marginBottom: 18, lineHeight: 1.6 }}>
        Here's what would help you most right now — no jargon, just the next few things worth doing.
      </div>
      {steps.map((s, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", background: L.panelAlt, border: `1px solid ${L.line}`, borderRadius: 10, marginBottom: 8 }}>
          <span style={{
            width: 24, height: 24, borderRadius: 99, background: L.accent, color: "#fff", display: "flex", alignItems: "center",
            justifyContent: "center", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, fontWeight: 700, flexShrink: 0,
          }}>{i + 1}</span>
          <span style={{ fontFamily: "Inter", fontSize: 13.5, color: L.text }}>{s}</span>
        </div>
      ))}
      <DataNote light>Same Root Cause AI routing everyone else sees — rewritten in plain, encouraging language for the person it's actually about.</DataNote>
    </Card>
  );
}

function ActionCenterView() {
  const [role, setRole] = useState("caseManager");
  const ROLES = [
    { id: "caseManager", label: "Case Manager" },
    { id: "executive", label: "Executive" },
    { id: "participant", label: "Participant" },
  ];
  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {ROLES.map((r) => (
          <button key={r.id} onClick={() => setRole(r.id)} style={{
            background: role === r.id ? T.gold : T.panel, color: role === r.id ? T.navyDeep : T.textMute,
            border: `1px solid ${role === r.id ? T.gold : T.line}`, borderRadius: 20, padding: "8px 16px",
            fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, cursor: "pointer", fontWeight: role === r.id ? 600 : 400,
          }}>{r.label}</button>
        ))}
      </div>
      {role === "caseManager" && <CaseManagerQueue />}
      {role === "executive" && <ExecutiveActions />}
      {role === "participant" && <ParticipantView />}
    </div>
  );
}

function CommandCenterView({ mod, onNavigate, setRadarPreset }) {
  const [topTab, setTopTab] = useState("rollup");
  const [clientView, setClientView] = useState(null);
  const radarData = SIGNALSCAN_ORGS[0].categories.slice(0, 6).map((c) => ({ subject: c.cat.split(" ")[0], value: 100 - c.score }));
  const detail = clientView ? CLIENT_DETAIL[clientView] : null;
  return (
    <div>
      <ModuleHeader mod={mod} />
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {[{ id: "rollup", label: "Rollup" }, { id: "actions", label: "Action Center" }].map((t) => (
          <button key={t.id} onClick={() => setTopTab(t.id)} style={{
            background: topTab === t.id ? T.gold : T.panel, color: topTab === t.id ? T.navyDeep : T.textMute,
            border: `1px solid ${topTab === t.id ? T.gold : T.line}`, borderRadius: 20, padding: "8px 16px",
            fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, cursor: "pointer", fontWeight: topTab === t.id ? 600 : 400,
          }}>{t.label}</button>
        ))}
      </div>
      {topTab === "actions" ? <ActionCenterView /> : (
      <>
      {clientView ? (
        detail ? (
          <ClientDetailView
            name={clientView} detail={detail} onBack={() => setClientView(null)}
            onViewTalent={() => { setRadarPreset("Debs Store"); onNavigate("radar"); }}
          />
        ) : (
          <Card>
            <button onClick={() => setClientView(null)} style={{ background: "none", border: "none", color: T.gold, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, cursor: "pointer", padding: 0, marginBottom: 16 }}>← Back to rollup</button>
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 18, color: T.text, marginBottom: 8 }}>{clientView}</div>
            <div style={{ fontFamily: "Inter", fontSize: 13, color: T.textMute }}>No detailed operational dashboard modeled yet for this engagement — LIFT JAX is the only one built out so far, based on their shared flyer.</div>
          </Card>
        )
      ) : (
      <>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, marginBottom: 20 }}>
        {[
          { label: "Program Impact Score", value: "4.82", sub: "/ 5.0" },
          { label: "Readiness Score", value: "3.86", sub: "↑ from 3.43" },
          { label: "ROI (est.)", value: "3.1×", sub: "cohort avg" },
          { label: "NPS", value: "+62", sub: "post-program" },
        ].map((k) => (
          <Card key={k.label}>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, color: T.textDim, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>{k.label}</div>
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 30, fontWeight: 700, color: T.text }}>{k.value}</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: T.gold, marginTop: 4 }}>{k.sub}</div>
          </Card>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
        <Card>
          <SectionLabel>Active Engagements — click for detailed view</SectionLabel>
          {CLIENTS.map((c) => (
            <div key={c} onClick={() => setClientView(c)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 4px", borderBottom: `1px solid ${T.line}`, cursor: "pointer" }}>
              <span style={{ fontFamily: "Inter", fontSize: 13, color: T.text }}>{c}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ width: 7, height: 7, borderRadius: 99, background: "#7fd6c8", display: "inline-block" }} />
                <ChevronRight size={14} color={T.textDim} />
              </div>
            </div>
          ))}
        </Card>
        <Card>
          <SectionLabel>Readiness Composite</SectionLabel>
          <ResponsiveContainer width="100%" height={180}>
            <RadarChart data={radarData} outerRadius={70}>
              <PolarGrid stroke={T.line} />
              <PolarAngleAxis dataKey="subject" tick={{ fill: T.textMute, fontSize: 10.5, fontFamily: "Inter" }} />
              <RRadar dataKey="value" stroke={T.gold} fill={T.gold} fillOpacity={0.28} />
            </RadarChart>
          </ResponsiveContainer>
        </Card>
      </div>
      <Card>
        <SectionLabel>Module Rollup — jump into any module</SectionLabel>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px,1fr))", gap: 10 }}>
          {MODULES.filter((m) => m.id !== "cec").map((m) => {
            const Icon = m.icon;
            return (
              <button key={m.id} onClick={() => onNavigate(m.id)} style={{
                background: T.panelAlt, border: `1px solid ${T.line}`, borderLeft: `3px solid ${LAYER[m.layer].color}`,
                borderRadius: 10, padding: "14px 14px",
                display: "flex", flexDirection: "column", gap: 8, cursor: "pointer", textAlign: "left",
              }}>
                <Icon size={17} color={T.gold} strokeWidth={1.75} />
                <span style={{ fontFamily: "Inter", fontSize: 12.5, color: T.text, fontWeight: 500 }}>{m.short}</span>
                <StagePill stage={m.stage} />
              </button>
            );
          })}
        </div>
      </Card>
      <DataNote>Rolls up outputs from every other module — no independent logic, aggregation and reporting only. This is the shell every module ultimately reports into.</DataNote>
      </>
      )}
      </>
      )}
    </div>
  );
}

/* ────────────────────────────────────────────────────────────
   SHELL — sidebar + router
──────────────────────────────────────────────────────────── */
const VIEWS = {
  signalscan: SignalScanView, radar: TalentRadarView, succession: SuccessionPlanningView, rootcause: RootCauseView,
  constellation: ConstellationView, intervention: InterventionView,
  predictive: PredictiveView, cec: CommandCenterView, marketplace: MarketplaceView,
};

function OrbitSystemSkeleton() {
  const [active, setActive] = useState("cec");
  const [radarPreset, setRadarPreset] = useState(null);
  const mod = MODULES.find((m) => m.id === active);
  const View = VIEWS[active];
  const cecModule = MODULES.find((m) => m.id === "cec");
  const layerGroups = Object.keys(LAYER).map((layerName) => ({
    layerName, mods: MODULES.filter((m) => m.layer === layerName && m.id !== "cec"),
  }));

  return (
    <div style={{ minHeight: "100vh", background: T.navyDeep, display: "flex", fontFamily: "Inter, sans-serif" }}>
      <style>{fontImport}</style>

      {/* SIDEBAR */}
      <div style={{ width: 244, background: T.navy, borderRight: `1px solid ${T.line}`, padding: "26px 16px", display: "flex", flexDirection: "column", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "0 8px", marginBottom: 30 }}>
          <div style={{ width: 30, height: 30, borderRadius: 99, border: `1.5px solid ${T.gold}`, position: "relative", flexShrink: 0 }}>
            <span style={{ position: "absolute", top: 4, left: "50%", width: 4, height: 4, background: T.gold, borderRadius: 99, transform: "translateX(-50%)" }} />
            <span style={{ position: "absolute", width: 12, height: 12, border: `1px dotted ${T.gold}`, borderRadius: 99, top: 8, left: 8 }} />
          </div>
          <div>
            <div style={{ fontFamily: "'Playfair Display', serif", fontWeight: 700, fontSize: 15.5, color: T.text, letterSpacing: "0.02em" }}>O.R.B.I.T.</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, color: T.textDim, letterSpacing: "0.04em" }}>SYSTEM v0.1 — SKELETON</div>
          </div>
        </div>

        <div style={{ marginBottom: 18, paddingBottom: 14, borderBottom: `1px solid ${T.line}` }}>
          <div style={{
            fontFamily: "'IBM Plex Mono', monospace", fontSize: 9.5, color: T.gold,
            textTransform: "uppercase", letterSpacing: "0.08em", padding: "0 8px 8px",
            display: "flex", alignItems: "center", gap: 6,
          }}>
            <span style={{ width: 6, height: 6, borderRadius: 99, background: T.gold, display: "inline-block" }} />
            All Layers
          </div>
          <NavItem m={cecModule} active={active} setActive={setActive} />
        </div>

        {layerGroups.map((g, i) => (
          <div key={g.layerName}>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace", fontSize: 9.5, color: LAYER[g.layerName].color,
              textTransform: "uppercase", letterSpacing: "0.08em", padding: "0 8px 8px", marginTop: i > 0 ? 18 : 0,
              display: "flex", alignItems: "center", gap: 6,
            }}>
              <span style={{ width: 6, height: 6, borderRadius: 99, background: LAYER[g.layerName].color, display: "inline-block" }} />
              {g.layerName}
            </div>
            {g.mods.map((m) => <NavItem key={m.id} m={m} active={active} setActive={setActive} />)}
          </div>
        ))}

        <div style={{ marginTop: "auto", padding: "14px 10px", borderTop: `1px solid ${T.line}`, fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, color: T.textDim, lineHeight: 1.6 }}>
          Rules-based v1 across 6 of 9 modules.<br />Predictive AI is the only v2 AI/ML candidate.
        </div>
      </div>

      {/* MAIN */}
      <div style={{ flex: 1, padding: "34px 40px", maxWidth: 1180 }}>
        <View mod={mod} onNavigate={setActive} radarPreset={radarPreset} setRadarPreset={setRadarPreset} />
      </div>
    </div>
  );
}

function NavItem({ m, active, setActive }) {
  const Icon = m.icon;
  const isActive = active === m.id;
  return (
    <button onClick={() => setActive(m.id)} style={{
      width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "9px 10px", borderRadius: 8,
      background: isActive ? T.goldSoft : "transparent", border: "none", cursor: "pointer", marginBottom: 2,
      color: isActive ? T.gold : T.textMute, textAlign: "left",
    }}>
      <Icon size={15} strokeWidth={1.75} />
      <span style={{ fontFamily: "Inter", fontSize: 12.5, fontWeight: isActive ? 600 : 400 }}>{m.short}</span>
    </button>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<OrbitSystemSkeleton />);
</script>
</body>
</html>
